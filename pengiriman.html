<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrintTrack - 5. Pengiriman & Tanda Terima</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
  <script>
    if (localStorage.getItem('theme') === 'light') {
      document.documentElement.classList.remove('dark');
    } else {
      document.documentElement.classList.add('dark');
    }
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: { brandDark: '#0b0f19', brandCard: '#151c2e' } } }
    }
  </script>
</head>
<body class="bg-slate-100 dark:bg-brandDark text-slate-800 dark:text-slate-100 font-sans min-h-screen transition-colors duration-300">

  <!-- Header Mobile Responsive -->
  <header class="border-b border-slate-300 dark:border-slate-800 bg-white/80 dark:bg-slate-900/50 backdrop-blur sticky top-0 z-50 transition-colors">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="w-full md:w-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
          <div class="w-8 h-8 rounded-lg bg-cyan-500/20 border border-cyan-500/50 flex items-center justify-center font-bold text-cyan-600 dark:text-cyan-400">PT</div>
          <h1 class="text-lg font-bold tracking-wider text-slate-900 dark:text-white">PRINT<span class="text-cyan-600 dark:text-cyan-400">TRACK</span></h1>
        </div>
        <button onclick="toggleTheme()" class="p-1.5 rounded-lg bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 text-xs font-bold flex items-center gap-1 transition">
          <span id="themeIcon">☀️</span>
          <span id="themeText" class="text-[11px]">Terang</span>
        </button>
      </div>
      
      <div class="w-full md:w-auto overflow-x-auto no-scrollbar pb-1 md:pb-0 flex items-center gap-1.5 whitespace-nowrap">
        <a href="index.html" class="text-[11px] bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-400 shrink-0">1. Terima</a>
        <a href="produksi.html" class="text-[11px] bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-400 shrink-0">2. Produksi</a>
        <a href="finishing.html" class="text-[11px] bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-400 shrink-0">3. Finishing</a>
        <a href="paking.html" class="text-[11px] bg-slate-200 dark:bg-slate-800 hover:bg-slate-300 dark:hover:bg-slate-700 px-3 py-1.5 rounded-lg border border-slate-300 dark:border-slate-700 text-slate-700 dark:text-slate-400 shrink-0">4. Paking</a>
        <a href="pengiriman.html" class="text-[11px] bg-emerald-500 text-slate-950 font-bold px-3 py-1.5 rounded-lg border border-emerald-400 shrink-0">5. Pengiriman</a>
        <a href="dashboard.html" class="text-[11px] bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg border border-amber-400 shrink-0">📊 Dashboard</a>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      <div class="lg:col-span-6 bg-white dark:bg-brandCard p-4 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xl space-y-4">
        <h3 class="text-xs sm:text-sm font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-2">
          <span>📤</span> Form Input Bukti Penerimaan (POD)
        </h3>

        <form onsubmit="updatePOD(event)" class="space-y-3 text-xs">
          <div>
            <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Nama Penerima</label>
            <input type="text" id="inputPenerima" required value="Ibu Sarah (Receptionist)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-slate-900 dark:text-white font-bold focus:outline-none">
          </div>
          <div>
            <label class="block font-medium text-slate-700 dark:text-slate-300 mb-1">Upload Foto Penyerahan</label>
            <input type="file" onchange="previewImage(event)" class="w-full bg-slate-50 dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl p-1.5 text-slate-500 text-[11px]">
          </div>
          <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl shadow transition text-xs sm:text-sm">
            💾 UPDATE SURAT JALAN & SIMPAN
          </button>
        </form>
      </div>

      <div class="lg:col-span-6">
        <div class="bg-white dark:bg-brandCard p-4 sm:p-6 rounded-2xl border border-slate-200 dark:border-slate-800 sticky top-20 space-y-3">
          <h2 class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase">Pratinjau Bukti Tanda Terima</h2>
          <div class="bg-white text-slate-900 rounded-xl p-4 space-y-3 border-2 border-slate-300 text-xs">
            <div class="border-2 border-emerald-500/40 rounded-xl p-2.5 bg-emerald-50/50 space-y-2">
              <div class="w-full h-36 rounded-lg overflow-hidden border border-slate-300 relative">
                <img id="podImageDisplay" src="https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=600&q=80" alt="POD" class="w-full h-full object-cover">
              </div>
              <p class="text-[10px]">Diterima Oleh: <strong id="penerimaDisplay">Ibu Sarah (Receptionist)</strong></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script>
    function updateThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeText').innerText = isDark ? 'Terang' : 'Gelap';
    }
    function toggleTheme() {
      const html = document.documentElement;
      if (html.classList.contains('dark')) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
      updateThemeUI();
    }
    updateThemeUI();

    function previewImage(event) {
      const reader = new FileReader();
      reader.onload = function() {
        document.getElementById('podImageDisplay').src = reader.result;
      }
      reader.readAsDataURL(event.target.files[0]);
    }
    function updatePOD(e) {
      e.preventDefault();
      const penerima = document.getElementById('inputPenerima').value;
      document.getElementById('penerimaDisplay').innerText = penerima;
      alert(`Bukti Penerimaan Diperbarui!`);
    }
  </script>
</body>
</html>
